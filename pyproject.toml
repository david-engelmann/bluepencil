[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepencil"
version = "0.1.0"
description = "An editor for rules files, striking the ignored, rewriting the misread, promoting the buried"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
bluepencil = "bluepencil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
